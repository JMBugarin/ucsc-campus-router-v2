name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    name: Data tools and campus data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r data-pipeline/requirements.txt
      - name: Pipeline script imports and parses its arguments
        run: python data-pipeline/build_graph.py --help
      - name: Check exported graph files
        run: python -m unittest discover -s data-pipeline/tests -v

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Tests again in a time zone a day ahead of Pacific, where the calendar date differs
        run: TZ=Pacific/Kiritimati flutter test

  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  ios:
    name: iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release build for a device, unsigned
        run: flutter build ios --release --no-codesign
